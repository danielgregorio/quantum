# quantum relay on Fly.io (https://fly.io), which gives it HTTPS: the players
# join wss://<app>.fly.dev/<game>/<room>. From the repository's root:
#
#   fly launch --no-deploy --copy-config --config deploy/relay/fly.toml --name <your-app>
#   fly deploy --config deploy/relay/fly.toml --dockerfile deploy/relay/Dockerfile
#   fly scale count 1 --config deploy/relay/fly.toml
#
# One machine: a room lives in the machine its first player reached, so two
# machines would split players who name the same room.
app = "quantum-relay"
primary_region = "gru"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
