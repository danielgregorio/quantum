# Quantum Configuration File
# Simple, magical configuration - ColdFusion style! 🪄

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server:
  # Port to listen on
  port: 8080

  # Host to bind to. Defaults to loopback: the server is reachable only from
  # this machine. Set 0.0.0.0 to expose it on the network — but read the debug
  # note below first, and put a real WSGI server (gunicorn) in front for
  # anything beyond local development.
  host: 127.0.0.1

  # Auto-reload when .q files change (development mode)
  reload: true

  # Werkzeug's debug mode includes an INTERACTIVE CONSOLE that evaluates
  # arbitrary Python. On a non-loopback host that is remote code execution for
  # anyone who can reach the port, so the server refuses to run the debugger
  # unless host is loopback. Keep this false in production regardless.
  debug: false

# ==========================================
# PATHS CONFIGURATION
# ==========================================
paths:
  # Where your .q component files are located
  components: ./components

  # Where static files (CSS, JS, images) are located
  static: ./static

  # Root for q:file. Every upload, read and delete is confined to this
  # directory — a databound path that escapes it is refused rather than
  # followed, so a form field cannot reach the rest of the disk.
  uploads: ./uploads

  # Where logs should be written
  logs: ./logs

# ==========================================
# DEFAULTS
# ==========================================
defaults:
  # Default component type if not specified
  component_type: pure

  # Enable client-side interactivity by default (Phase 3 feature)
  interactive: false

  # Default charset for responses
  charset: utf-8

  # Default timeout for component execution (seconds)
  timeout: 30

# ==========================================
# DATASOURCES
# ==========================================
# Declare datasources here and q:query works with no other process running.
# This is the default path. The Quantum Admin API (below) is the optional,
# advanced path for centrally managed datasources.
datasources:
  # Used by the examples/test-query-*.q files.
  # Create it with: python -c "import test_database; test_database.TestDatabase().setup()"
  test-sqlite:
    driver: sqlite
    database: ./test_data/quantum_test.db

  # A typical app datasource:
  # db:
  #   driver: sqlite
  #   database: ./data/app.db
  #
  # PostgreSQL / MySQL follow the same shape:
  # db:
  #   driver: postgresql
  #   host: localhost
  #   port: 5432
  #   database: myapp
  #   username: postgres
  #   password: ${DB_PASSWORD}

# ==========================================
# DATABASE (QUANTUM ADMIN INTEGRATION — OPTIONAL)
# ==========================================
database:
  # Only consulted for datasources NOT declared above.
  admin_api: http://localhost:8000/api

# ==========================================
# LLM (Ollama Backend)
# ==========================================
llm:
  # Ollama API base URL
  base_url: http://localhost:11434

  # Model for q:llm and q:agent when they declare none (SPEC IA-1);
  # QUANTUM_LLM_DEFAULT_MODEL wins over it. There is no built-in default.
  model: phi3

  # Default timeout in seconds for LLM requests
  timeout: 60

# ==========================================
# PERFORMANCE
# ==========================================
mail:
  # MAIL-1: without this section q:mail is an error. `host: log` writes each
  # message to the log instead of sending it — what the examples/test-email-*.q
  # files need. A real server: host, port, username, password, tls, from.
  host: log
  from: examples@quantum.dev

performance:
  # Cache parsed templates (AST cache)
  cache_templates: false

  # Cache TTL in seconds (0 = cache forever, -1 = no cache)
  cache_ttl: 300

  # Maximum number of cached templates
  cache_max_size: 100

# ==========================================
# SECURITY
# ==========================================
security:
  # (There is no CORS setting: nothing implemented it, and cors_* keys are
  # warned about at startup — CFG-2.)

  # Enable XSS protection (HTML escaping)
  xss_protection: true

  # Allow q:python / q:pyclass / q:pyimport to execute.
  # These run arbitrary Python in the server process with NO sandbox (full
  # filesystem, network and os access).
  #
  # OFF by default since the inversion: a default has to be safe for whoever
  # has not read the documentation, and running a .q you did not write must
  # not mean running its Python. Whoever uses q:python has read it — they had
  # to write the tag.
  #
  # This repository turns it on because its own examples use q:python.
  # Turn it off before letting any template generated by an LLM or sent by
  # third parties run. See SECURITY.md.
  python_scripting: true

  # Maximum request body size (bytes)
  max_content_length: 16777216  # 16 MB

# ==========================================
# LOGGING
# ==========================================
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO

  # Log format
  format: "[%(levelname)s] %(asctime)s - %(message)s"

  # Log to console
  console: true

  # Log to file
  file: true

  # Log file name
  filename: quantum.log

# ==========================================
# DEVELOPMENT
# ==========================================
development:
  # Show detailed error pages
  show_errors: true

  # Enable profiler
  profiler: false

  # Enable debug toolbar (Flask debug toolbar)
  debug_toolbar: false


# ==========================================
# DECLARED SERVICES
# ==========================================
# Python modules whose @service functions the pages call with
# <q:invoke service="...">. See docs/guide/services.md.
# (The Quantum Admin is no longer served from here: run `quantum admin`.)
# services:
#   - myapp.services
