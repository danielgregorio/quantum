# Quantum Chat — a shared chat room: application-scoped messages, HTMX polling.
#
#   quantum start          # http://127.0.0.1:8080
#   quantum test           # runs tests/chat.test.q
#
# The messages live in the application scope (EXEC-3): one server process, one
# room; they are gone after a restart. Set QUANTUM_SECRET_KEY to keep sessions
# across restarts.

server:
  port: 8080
  host: 0.0.0.0
  reload: false
  debug: false
paths:
  components: ./components
  static: ./static
  logs: ./logs
defaults:
  component_type: pure
  charset: utf-8
  timeout: 30
performance:
  cache_templates: false
  cache_ttl: 300
security:
  xss_protection: true
logging:
  level: INFO
  console: true
