# Bank transfer — money moves between accounts inside one q:transaction.
#
#   quantum migrate up     # creates data/bank.db with three accounts
#   quantum start          # http://127.0.0.1:8080
#   quantum test           # the suites in tests/, each on a fresh database
#
# The proof app for q:transaction (DB-4): the debit, the credit and the
# history row commit together, or none of them does.

server:
  port: 8080
  host: 127.0.0.1
  reload: false
  debug: false

paths:
  components: ./components
  migrations: ./migrations

datasources:
  db:
    driver: sqlite
    database: ./data/bank.db

logging:
  level: INFO
  console: true
  file: false
