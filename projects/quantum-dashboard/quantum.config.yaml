# Quantum Dashboard — a task list on SQLite.
#
#   quantum migrate up     # creates data/tasks.db with a few demo tasks
#   quantum start          # http://127.0.0.1:8080

server:
  port: 8080
  host: 127.0.0.1
  reload: false
  debug: false

paths:
  components: ./components
  static: ./static
  logs: ./logs
  migrations: ./migrations

datasources:
  taskdb:
    driver: sqlite
    database: ./data/tasks.db

logging:
  level: INFO
  console: true
  file: false
