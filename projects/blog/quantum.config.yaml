# Quantum Blog
#
#   quantum migrate up     # creates data/blog.db with the tables and sample posts
#   quantum start          # http://127.0.0.1:8080
#   quantum test           # runs tests/*.test.q and components/**/*.test.q
#
# The first visit to /login offers to create the admin account.

server:
  port: 8080
  host: 127.0.0.1
  reload: false
  debug: false

paths:
  components: ./components
  static: ./static
  logs: ./logs
  migrations: ./migrations

datasources:
  blog-db:
    driver: sqlite
    database: ./data/blog.db

logging:
  level: INFO
  console: true
  file: false
