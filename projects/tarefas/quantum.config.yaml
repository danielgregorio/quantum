# Tarefas — um app em ui:* sobre SQLite.
#
#   quantum migrate up     # cria data/tarefas.db com algumas tarefas
#   quantum start          # http://127.0.0.1:8080
#   quantum console        # no terminal
#   quantum desktop        # numa janela (pip install "quantum-framework[desktop]")
#
# É o app de prova do UI Engine: o mesmo .q vira página
# web, app de console e app de desktop.

server:
  port: 8080
  host: 127.0.0.1
  reload: false
  debug: false

paths:
  components: ./components
  migrations: ./migrations

datasources:
  db:
    driver: sqlite
    database: ./data/tarefas.db
    history: true          # every change made by an action is recorded (DB-11)

logging:
  level: INFO
  console: true
  file: false
