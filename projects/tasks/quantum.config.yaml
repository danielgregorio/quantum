# Tasks: an app in ui:* on SQLite.
#
#   quantum migrate up     # creates data/tasks.db with a few tasks
#   quantum start          # http://127.0.0.1:8080
#   quantum console        # in the terminal
#   quantum desktop        # in a window (pip install "quantum-framework[desktop]")
#
# It is the UI Engine's proving app: the same .q becomes a web
# page, a console app and a desktop app.

server:
  port: 8080
  host: 127.0.0.1
  reload: false
  debug: false

paths:
  components: ./components
  migrations: ./migrations

datasources:
  db:
    driver: sqlite
    database: ./data/tasks.db
    history: true          # every change made by an action is recorded (DB-11)

logging:
  level: INFO
  console: true
  file: false
