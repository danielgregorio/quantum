<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>kenney_platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; transform: scale(3); transform-origin: center center; }
    .qg-hud { position: absolute; pointer-events: none; padding: 8px; font-family: sans-serif; z-index: 10; }
    .qg-hud-top-left { top: 0; left: 0; }
    .qg-hud-top-right { top: 0; right: 0; }
    .qg-hud-top-center { top: 0; left: 50%; transform: translateX(-50%); }
    .qg-hud-bottom-left { bottom: 0; left: 0; }
    .qg-hud-bottom-right { bottom: 0; right: 0; }
    .qg-hud-bottom-center { bottom: 0; left: 50%; transform: translateX(-50%); }
    .qg-hud-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* Source Code Viewer */
    #qg-source-btn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 12px;
      transition: all 0.2s;
    }
    #qg-source-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.9);
    }
    #qg-source-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 999;
      overflow: auto;
    }
    #qg-source-modal.visible {
      display: flex;
      flex-direction: column;
    }
    #qg-source-close {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
      z-index: 1001;
    }
    #qg-source-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    #qg-source-content {
      flex: 1;
      overflow: auto;
      padding: 48px 24px 24px;
    }
    #qg-source-content pre {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 24px;
      border-radius: 12px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 1.7;
      overflow-x: auto;
      white-space: pre;
      tab-size: 2;
      border: 1px solid #313244;
      max-width: 900px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="qg-hud qg-hud-top-left" id="qg-hud-0"></div>
  <div class="qg-hud qg-hud-top-center" id="qg-hud-1"></div>
  <div class="qg-hud qg-hud-top-right" id="qg-hud-2"></div>
  <div class="qg-hud qg-hud-center" id="qg-hud-3"></div>
  <button id="qg-source-btn" onclick="toggleSource()">source</button>
  <div id="qg-source-modal">
    <button id="qg-source-close" onclick="toggleSource()">ESC</button>
    <div id="qg-source-content">
      <pre id="qg-source-code">No source code available</pre>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20/build/matter.min.js"></script>
  <script>
function toggleSource() {
  var modal = document.getElementById('qg-source-modal');
  modal.classList.toggle('visible');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('qg-source-modal').classList.remove('visible');
  }
});
(async function() {

  // === PIXI APP ===
  const app = new PIXI.Application();
  await app.init({ width: 800, height: 450, background: "#92CDDB" });
  document.body.appendChild(app.canvas);
  // World size: 3600x450, Viewport: 800x450

  // === MATTER.JS ENGINE ===
  const mEngine = Matter.Engine.create();
  mEngine.gravity.x = 0;
  mEngine.gravity.y = 9.8;
  // Increase solver iterations for tighter collision resolution
  mEngine.positionIterations = 10;
  mEngine.velocityIterations = 8;
  const mWorld = mEngine.world;

  // === EVENT BUS ===
  // Event Bus
  const _gameEvents = { _listeners: {} };
  _gameEvents.on = function(event, cb) {
    if (!this._listeners[event]) {
      this._listeners[event] = [];
    }
    this._listeners[event].push(cb);
  };
  _gameEvents.off = function(event, cb) {
    if (this._listeners[event]) {
      this._listeners[event] = this._listeners[event].filter(fn => fn !== cb);
    }
  };
  _gameEvents.emit = function(event, data) {
    if (this._listeners[event]) {
      for (const cb of this._listeners[event]) {
        cb(data);
      }
    }
  };

  // === GAME STATE ===
  let score = 0;
  let coins = 0;
  let lives = 3;
  let gameOver = false;
  let won = false;

  // === ASSET LOADING ===
  await PIXI.Assets.load(["assets/kenney/audio/block.ogg", "assets/kenney/audio/coin.ogg", "assets/kenney/audio/hurt.ogg", "assets/kenney/audio/jump.ogg", "assets/kenney/audio/powerup.ogg", "assets/kenney/audio/stomp.ogg", "assets/kenney/audio/win.ogg", "assets/kenney/tilemap-characters_packed.png", "assets/kenney/tilemap_packed.png"]);

  // === ANIMATION SYSTEM ===
  // Animation System
  const _animatedSprites = {};

  function _parseFrames(spec) {
    if (spec.includes('-')) {
      const parts = spec.split('-').map(Number);
      const result = [];
      for (let i = parts[0]; i <= parts[1]; i += 1) {
        result.push(i);
      }
      return result;
    }
    return spec.split(',').map(s => parseInt(s.trim(), 10));
  }

  function _registerAnimation(spriteId, texture, frameW, frameH, anims) {
    if (!texture || !frameW || !frameH) {
      return;
    }
    // PIXI v8: get texture source and dimensions
    const baseTexture = texture.source || texture.baseTexture || texture;
    const texW = texture.width || baseTexture.width || (texture.frame && texture.frame.width) || 0;
    const texH = texture.height || baseTexture.height || (texture.frame && texture.frame.height) || 0;
    if (!texW || !texH) {
      console.warn('Animation failed for', spriteId, '- texture dimensions not found');
      return;
    }
    const cols = Math.floor(texW / frameW);
    const rows = Math.floor(texH / frameH);
    const totalFrames = cols * rows;

    // Build frame textures
    const frameTextures = [];
    for (let i = 0; i <= totalFrames - 1; i += 1) {
      const fx = i % cols;
      const fy = Math.floor(i / cols);
      const rect = new PIXI.Rectangle(fx * frameW, fy * frameH, frameW, frameH);
      const frameTex = new PIXI.Texture({ source: baseTexture, frame: rect });
      frameTextures.push(frameTex);
    }

    // Parse named animations
    const animDefs = {};
    let defaultAnim = null;
    for (const [name, cfg] of Object.entries(anims)) {
      const frames = _parseFrames(cfg.frames);
      const textures = frames.filter(f => f < frameTextures.length).map(f => frameTextures[f]);
      if (textures.length > 0) {
        animDefs[name] = { textures: textures, speed: cfg.speed || 0.1, loop: cfg.loop !== false };
        if (cfg.autoPlay) {
          defaultAnim = name;
        }
      }
    }

    if (Object.keys(animDefs).length === 0) {
      return;
    }

    if (!defaultAnim) {
      defaultAnim = Object.keys(animDefs)[0];
    }

    // Create animated sprite
    const firstAnim = animDefs[defaultAnim];
    const animSprite = new PIXI.AnimatedSprite(firstAnim.textures);
    animSprite.animationSpeed = firstAnim.speed;
    if (firstAnim.loop !== false) {
      animSprite.loop = true;
    }
    animSprite.play();

    // Copy transform from static sprite
    const info = _sprites[spriteId];
    if (info) {
      const oldSprite = info.sprite;
      animSprite.x = oldSprite.x;
      animSprite.y = oldSprite.y;
      animSprite.anchor.x = oldSprite.anchor ? oldSprite.anchor.x : 0.5;
      animSprite.anchor.y = oldSprite.anchor ? oldSprite.anchor.y : 0.5;
      animSprite.alpha = oldSprite.alpha;
      animSprite.visible = oldSprite.visible;

      // Replace in container
      const parent = oldSprite.parent;
      if (parent) {
        const idx = parent.getChildIndex(oldSprite);
        parent.removeChild(oldSprite);
        parent.addChildAt(animSprite, idx);
      }
      info.sprite = animSprite;
      _animatedSprites[spriteId] = { anims: animDefs, current: defaultAnim, sprite: animSprite };
    }
  }

  function _switchAnimation(spriteId, animName) {
    const entry = _animatedSprites[spriteId];
    if (!entry || entry.current === animName || !entry.anims[animName]) {
      return;
    }
    const anim = entry.anims[animName];
    entry.sprite.textures = anim.textures;
    entry.sprite.animationSpeed = anim.speed;
    entry.sprite.loop = anim.loop !== false;
    entry.sprite.gotoAndPlay(0);
    entry.current = animName;
  }

  function _updateAnimatedSprites(ticker) {
    for (const [spriteId, entry] of Object.entries(_animatedSprites)) {
      if (entry.sprite && entry.sprite.playing) {
        // PIXI v8: manually update animation using deltaMS
        entry.sprite.update(ticker);
      }
    }
  }

  function _updateControlAnimations() {
    for (const [spriteId, ctrl] of Object.entries(_controlledSprites)) {
      const entry = _animatedSprites[spriteId];
      if (!entry) {
        continue;
      }
      const info = _sprites[spriteId];
      if (!info || !info.body) {
        continue;
      }
      const vx = Math.abs(info.body.velocity.x);
      const vy = info.body.velocity.y;

      // Priority: jump > walk > idle
      if (Math.abs(vy) > 5 && entry.anims['jump']) {
        _switchAnimation(spriteId, 'jump');
      } else if (vx > 0.1 && _keys[ctrl.right] && entry.anims['walk-right']) {
        _switchAnimation(spriteId, 'walk-right');
      } else if (vx > 0.1 && _keys[ctrl.left] && entry.anims['walk-left']) {
        _switchAnimation(spriteId, 'walk-left');
      } else if (vx > 0.1 && (entry.anims['walk'] || entry.anims['walk-right'])) {
        _switchAnimation(spriteId, entry.anims['walk'] ? 'walk' : 'walk-right');
      } else if (entry.anims['idle']) {
        _switchAnimation(spriteId, 'idle');
      }
    }
  }

  // === BEHAVIORS ===
  class PlayerBehavior {
    constructor(owner, overrides) {
      this.owner = owner;
      this.invulnFrames = 0;
      this.checkpointX = 36;
      this.checkpointY = 348;
      if (overrides) Object.assign(this, overrides);
    }
    get x() { return this.owner.sprite.x; }
    set x(v) { this.owner.sprite.x = v; }
    get y() { return this.owner.sprite.y; }
    set y(v) { this.owner.sprite.y = v; }
    get rotation() { return this.owner.sprite.rotation; }
    set rotation(v) { this.owner.sprite.rotation = v; }
    get alpha() { return this.owner.sprite.alpha; }
    set alpha(v) { this.owner.sprite.alpha = v; }
    get visible() { return this.owner.sprite.visible; }
    set visible(v) { this.owner.sprite.visible = v; }
    onEnemyHit() {
      var other = this._other;
      var myBody = this.owner.body;
      var enemyBody = other ? other.body : null;
      if (this.invulnFrames > 0) return;
      var stomped = false;
      if (myBody && enemyBody) {
      var myBottom = myBody.position.y + 12;
      var enemyCenter = enemyBody.position.y;
      stomped = (myBottom < enemyCenter + 4) && (myBody.velocity.y > 0);
      }
      if (stomped) {
      Matter.Body.setVelocity(myBody, {x: myBody.velocity.x, y: -10});
      game.destroy(other);
      score += 100;
      game.play('stomp_sfx');
      _updateHUD();
      } else {
      lives--;
      this.invulnFrames = 120;
      game.play('hurt_sfx');
      if (lives <= 0) {
      gameOver = true;
      } else {
      game.respawn("player", this.checkpointX, this.checkpointY);
      }
      _updateHUD();
      }
    }
    onCoinGet() {
      var other = this._other;
      coins++;
      score += 50;
      game.destroy(other);
      game.play('coin_sfx');
      if (coins >= 100) {
      coins = 0;
      lives++;
      }
      _updateHUD();
    }
    onGemGet() {
      var other = this._other;
      score += 500;
      game.destroy(other);
      game.play('powerup_sfx');
      _updateHUD();
    }
    onBlockHit() {
      var other = this._other;
      var myBody = this.owner.body;
      if (myBody && other && other.body) {
      var myY = myBody.position.y;
      var blockY = other.body.position.y;
      if (myY > blockY + 4 && myBody.velocity.y < 0) {
      coins++;
      score += 50;
      game.play('block_sfx');
      Matter.Body.setVelocity(myBody, {x: myBody.velocity.x, y: 2});
      var spr = other.sprite;
      if (spr) {
      var origY = spr.y;
      spr.y -= 6;
      setTimeout(function() { spr.y = origY; }, 150);
      }
      _updateHUD();
      }
      }
    }
    onFlagGet() {
      if (!won) {
      won = true;
      score += 5000;
      game.play('win_sfx');
      _updateHUD();
      var myBody = _sprites["player"].body;
      if (myBody) {
      Matter.Body.setStatic(myBody, true);
      Matter.Body.setVelocity(myBody, {x: 0, y: 0});
      }
      }
    }
    onCheckpoint() {
      this.checkpointX = this.owner.body ? this.owner.body.position.x : this.checkpointX;
      this.checkpointY = this.owner.body ? this.owner.body.position.y : this.checkpointY;
    }
    onDeath() {
      lives--;
      if (lives <= 0) {
      gameOver = true;
      } else {
      game.respawn("player", this.checkpointX, this.checkpointY);
      }
      _updateHUD();
    }
    update() {
      if (this.invulnFrames > 0) {
      this.invulnFrames--;
      var spr = this.owner.sprite;
      if (spr) {
      spr.alpha = (this.invulnFrames % 8 < 4) ? 0.3 : 1.0;
      }
      if (this.invulnFrames === 0 && spr) {
      spr.alpha = 1.0;
      }
      }
    }
  }

  class PatrolAI {
    constructor(owner, overrides) {
      this.owner = owner;
      this.dir = -1;
      this.spd = 1.0;
      if (overrides) Object.assign(this, overrides);
    }
    get x() { return this.owner.sprite.x; }
    set x(v) { this.owner.sprite.x = v; }
    get y() { return this.owner.sprite.y; }
    set y(v) { this.owner.sprite.y = v; }
    get rotation() { return this.owner.sprite.rotation; }
    set rotation(v) { this.owner.sprite.rotation = v; }
    get alpha() { return this.owner.sprite.alpha; }
    set alpha(v) { this.owner.sprite.alpha = v; }
    get visible() { return this.owner.sprite.visible; }
    set visible(v) { this.owner.sprite.visible = v; }
    update() {
      var b = this.owner.body;
      if (b) Matter.Body.setVelocity(b, {x: this.dir * this.spd, y: b.velocity.y});
    }
    onWall() {
      this.dir *= -1;
    }
  }

  class SmartPatrolAI {
    constructor(owner, overrides) {
      this.owner = owner;
      this.dir = -1;
      this.spd = 0.8;
      if (overrides) Object.assign(this, overrides);
    }
    get x() { return this.owner.sprite.x; }
    set x(v) { this.owner.sprite.x = v; }
    get y() { return this.owner.sprite.y; }
    set y(v) { this.owner.sprite.y = v; }
    get rotation() { return this.owner.sprite.rotation; }
    set rotation(v) { this.owner.sprite.rotation = v; }
    get alpha() { return this.owner.sprite.alpha; }
    set alpha(v) { this.owner.sprite.alpha = v; }
    get visible() { return this.owner.sprite.visible; }
    set visible(v) { this.owner.sprite.visible = v; }
    update() {
      var b = this.owner.body;
      if (b) Matter.Body.setVelocity(b, {x: this.dir * this.spd, y: b.velocity.y});
    }
    onWall() {
      this.dir *= -1;
    }
    onEdge() {
      this.dir *= -1;
    }
  }

  class FloatingCoin {
    constructor(owner, overrides) {
      this.owner = owner;
      this.timer = 0;
      this.baseY = 0;
      this.initialized = false;
      if (overrides) Object.assign(this, overrides);
    }
    get x() { return this.owner.sprite.x; }
    set x(v) { this.owner.sprite.x = v; }
    get y() { return this.owner.sprite.y; }
    set y(v) { this.owner.sprite.y = v; }
    get rotation() { return this.owner.sprite.rotation; }
    set rotation(v) { this.owner.sprite.rotation = v; }
    get alpha() { return this.owner.sprite.alpha; }
    set alpha(v) { this.owner.sprite.alpha = v; }
    get visible() { return this.owner.sprite.visible; }
    set visible(v) { this.owner.sprite.visible = v; }
    update() {
      if (!this.initialized) {
      this.baseY = this.owner.sprite ? this.owner.sprite.y : 0;
      this.initialized = true;
      }
      this.timer += 0.05;
      var spr = this.owner.sprite;
      if (spr) {
      spr.y = this.baseY + Math.sin(this.timer) * 3;
      }
    }
  }

  class ItemBlockBehavior {
    constructor(owner, overrides) {
      this.owner = owner;
      this.active = true;
      if (overrides) Object.assign(this, overrides);
    }
    get x() { return this.owner.sprite.x; }
    set x(v) { this.owner.sprite.x = v; }
    get y() { return this.owner.sprite.y; }
    set y(v) { this.owner.sprite.y = v; }
    get rotation() { return this.owner.sprite.rotation; }
    set rotation(v) { this.owner.sprite.rotation = v; }
    get alpha() { return this.owner.sprite.alpha; }
    set alpha(v) { this.owner.sprite.alpha = v; }
    get visible() { return this.owner.sprite.visible; }
    set visible(v) { this.owner.sprite.visible = v; }
    onHit() {
      if (!this.active) return;
      var other = this._other;
      if (!other || !other.body) return;
      var playerY = other.body.position.y;
      var blockY = this.owner.body ? this.owner.body.position.y : this.owner.sprite.y;
      if (playerY > blockY + 4) {
      this.active = false;
      coins++;
      score += 50;
      game.play('block_sfx');
      _updateHUD();
      var spr = this.owner.sprite;
      if (spr) {
      var origY = spr.y;
      spr.y -= 6;
      setTimeout(function() { spr.y = origY; }, 150);
      }
      }
    }
  }


  // === CAMERA ===
  const _cameraContainer = new PIXI.Container();
  app.stage.addChild(_cameraContainer);
  const _camera = { targetId: "player", lerp: 0.08 };

  function updateCamera() {
    const info = _sprites[_camera.targetId];
    if (!info) {
      return;
    }
    const tx = app.screen.width / 2 - info.sprite.x;
    const ty = app.screen.height / 2 - info.sprite.y;
    _cameraContainer.x += (tx - _cameraContainer.x) * _camera.lerp;
    _cameraContainer.y += (ty - _cameraContainer.y) * _camera.lerp;
    _cameraContainer.x = Math.min(0, Math.max(app.screen.width - 3600, _cameraContainer.x));
    _cameraContainer.y = Math.min(0, Math.max(app.screen.height - 450, _cameraContainer.y));

        // Replace with static sprite
        const newSprite = new PIXI.Sprite(frameTex);
        newSprite.anchor.set(0.5);
        newSprite.x = blockInfo.sprite.x;
        newSprite.y = blockInfo.sprite.y;
        const parent = blockInfo.sprite.parent;
        if (parent) {

  game.setPatrolAI = function(patrollerId, speed) {
    const info = _sprites[patrollerId];
    if (!info || !info.body) {
      return;
    }

    // Store the movement speed
    info._patrolSpeed = speed;
    info._patrolDir = speed < 0 ? -1 : 1;

    // Add update behavior for patroller AI
    if (!info.behaviors) {
      info.behaviors = [];
    }
    info.behaviors.push({
      update: function() {
        // Skip if game is paused
        if (game._paused) return;
        const gInfo = _sprites[patrollerId];
        if (!gInfo || !gInfo.body) return;

        // Apply constant horizontal velocity
        const currentSpeed = Math.abs(gInfo._patrolSpeed) * gInfo._patrolDir;
        Matter.Body.setVelocity(gInfo.body, { x: currentSpeed, y: gInfo.body.velocity.y });

        // Flip sprite based on direction
        if (gInfo.sprite) {
          gInfo.sprite.scale.x = gInfo._patrolDir > 0 ? -1 : 1;
        }
      }
    });

    // Listen for collisions to change direction (lateral only)
    if (!info.collisionHandlers) {
      info.collisionHandlers = [];
    }
    info.collisionHandlers.push(function(self, other) {
      const gInfo = _sprites[patrollerId];
      if (!gInfo || !gInfo.body || !other.body) return;

      // Only react to terrain/walls, not players or other enemies
      const isWall = other.tag === 'terrain' || other.tag === 'tilemap-collision' || other.tag === 'wall' || other.tag === 'item_block';
      if (!isWall) return;

      // Use body bounds to detect lateral vs vertical contact
      const gb = gInfo.body.bounds;
      const ob = other.body.bounds;
      const overlapX = Math.min(gb.max.x, ob.max.x) - Math.max(gb.min.x, ob.min.x);
      const overlapY = Math.min(gb.max.y, ob.max.y) - Math.max(gb.min.y, ob.min.y);
      // Lateral collision: small horizontal overlap, larger vertical overlap
      if (overlapX > 0 && overlapY > 0 && overlapX < overlapY) {
        // Cooldown to prevent rapid flipping
        const now = Date.now();
        if (!gInfo._lastFlipTime || now - gInfo._lastFlipTime > 200) {
          gInfo._patrolDir *= -1;
          gInfo._lastFlipTime = now;
        }
      }
    });
  };

    const centerX = app.screen.width / 2;

    const animate = () => {
      frame++;

      const radius = maxRadius * t;
      overlay.clear();
      overlay.rect(0, 0, app.screen.width, app.screen.height);
      overlay.fill(0x000000);
