# Docs assistant — ask the Quantum guide (docs/guide), answers with sources.
#
#   quantum start      # http://127.0.0.1:8080
#   quantum console    # the same app in the terminal
#
# Needs a model server (Ollama) with phi3 and nomic-embed-text, and the RAG
# extra: pip install "quantum-framework[rag]". QUANTUM_LLM_BASE_URL points at
# the server when it is not this machine.

server:
  port: 8080
  host: 127.0.0.1
  reload: false
  debug: false

paths:
  components: ./components

llm:
  base_url: http://localhost:11434
