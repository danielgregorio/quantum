# Ajustes: the machine's settings on the Hive's screen (`hive ajustes`), or in a
# browser (`quantum start` in this folder). Reading only, as the user who opened
# it; a change goes through the Hive (os/CLAUDE.md, "Apps").
server:
  port: 8080
  host: 127.0.0.1
  reload: false
  debug: false

paths:
  components: ./components

# Installed under /usr/share, which is nobody's to write: the log goes to
# stderr only (hive ajustes keeps it in the terminal it was run from).
logging:
  file: false

services:
  - leitura
