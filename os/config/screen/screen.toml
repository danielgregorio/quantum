[[rules]]
event = "service-crash"

[[rules.actions]]
kind = "animate"
target = "{service}"
name = "smoke"

[[rules.actions]]
kind = "emit"
particles = "dust"
at = "{service}"
dx = 12
dy = 12

[[rules.actions]]
kind = "say"
text = "{service} stopped (exit {exit_code})"
seconds = 4.0

[[rules]]
event = "log-anomaly"

[[rules.actions]]
kind = "animate"
target = "{service}"
name = "worry"

[[rules.actions]]
kind = "say"
text = "{service} is logging errors"
seconds = 4.0

[[rules]]
event = "port-conflict"

[[rules.actions]]
kind = "say"
text = "port {port}: {requester} wanted it, {holder} holds it"
seconds = 4.0

[[rules]]
event = "disk-low"

[[rules.actions]]
kind = "say"
text = "{mount} is {percent}% full, {free_mb} MB free"
seconds = 4.0

[[rules]]
event = "memory-pressure"

[[rules.actions]]
kind = "say"
text = "memory: {free_mb} of {total_mb} MB free"
seconds = 4.0

[[rules]]
event = "command-observed"

[[rules.actions]]
kind = "say"
text = "watched: {cmd}"
seconds = 4.0

[[rules]]
event = "command-not-found"

[[rules.actions]]
kind = "say"
text = "{command}: not installed; {package} would provide it"
seconds = 4.0

[[rules]]
event = "notice"

[[rules.actions]]
kind = "say"
text = "{title}: {body}"
seconds = 4.0

[[rules]]
event = "offer"

[[rules.actions]]
kind = "emit"
particles = "stars"
at = "bee"
dx = 8
dy = 8

[[rules.actions]]
kind = "tween"
target = "bee"
property = "y"
to = 8.0
from = 2.0
seconds = 0.4
trans = "sine"
ease = "in-out"
repeat = 3
yoyo = true

[[rules.actions]]
kind = "say"
text = "the Hive offers {count}: up and down choose, Enter approves, Escape dismisses"
seconds = 6.0

[[rules]]
event = "done"

[[rules.actions]]
kind = "frame"
target = "{service}"
frame = 0

[[rules.actions]]
kind = "emit"
particles = "stars"
at = "{service}"
dx = 12
dy = 12

[[rules.actions]]
kind = "say"
text = "{action}: done"
seconds = 4.0

[[rules]]
event = "failed"

[[rules.actions]]
kind = "say"
text = "{action} failed: {output}"
seconds = 8.0
