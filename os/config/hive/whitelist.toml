# Written by Quantum from hive.q: hive-actuator's whitelist, which fails closed. Do not edit; edit the .q and run it again (`quantum run hive.q`).

[meta]
version = 2

[run_command]
allowed = [
    { command = "df", args = ["-h"] },
    { command = "free", args = ["-h"] },
    { command = "uptime", args = [] },
    { command = "whoami", args = [] },
    { command = "id", args = [] },
    { command = "uname", args = ["-a"] },
    { command = "ss", args = ["-tlnp"] },
    { command = "ip", args = ["addr"] },
    { command = "ip", args = ["route"] },
    { command = "systemctl", args = ["status", "*"] },
    { command = "systemctl", args = ["is-active", "*"] },
    { command = "journalctl", args = ["-n", "50", "-u", "*"] },
    { command = "zpool", args = ["status"] },
    { command = "zfs", args = ["list"] },
    { command = "zfs", args = ["list", "-t", "snapshot"] },
]

[service]
allowed = [
    "nginx",
    "apache2",
    "postgresql",
    "mysql",
    "mariadb",
    "redis-server",
    "mongodb",
    "docker",
    "containerd",
    "NetworkManager",
    "cups",
    "bluetooth",
]
blocked = ["hive-*", "systemd-*", "dbus", "sshd"]

[apt_remove]
blocked_packages = [
    "systemd",
    "linux-image-*",
    "grub-*",
    "hive-*",
    "zfs-*",
    "libc6",
    "apt",
    "dpkg",
]

[file_ops]
allowed_paths = ["/home/*", "/tmp/*", "/var/tmp/*"]
blocked_paths = [
    "/home/*/.ssh/*",
    "/home/*/.gnupg/*",
    "/etc/*",
    "/usr/*",
    "/bin/*",
    "/sbin/*",
    "/lib/*",
    "/boot/*",
    "/root/*",
]

[zfs]
allowed_datasets = ["rpool/ROOT/*", "rpool/home/*"]
destroy_snapshot_pattern = "hive-*"

[misc]
kill_port_process = true
open_url = true
firewall = false
set_hostname = true
set_keyboard = true
set_screen_level = true
set_network = true

[rate_limits]
SetHostname = 2
SetKeyboard = 2
SetScreenLevel = 2
SetNetwork = 2
KillPortProcess = 10
InstallPackage = 5
RemovePackage = 3
CreateDirectory = 20
MoveFile = 20
CopyFile = 20
DeleteFile = 20
ChangePermissions = 20
CreateSnapshot = 10
RestoreSnapshot = 10
DeleteSnapshot = 10
