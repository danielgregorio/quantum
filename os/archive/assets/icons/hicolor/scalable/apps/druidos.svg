<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B5CFF"/>
      <stop offset="100%" style="stop-color:#9D85FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B5CFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#9D85FF;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0D0D0D"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#accent)" stroke-width="2"/>

  <!-- Outer glow -->
  <circle cx="64" cy="64" r="50" fill="url(#glow)"/>

  <!-- Central eye/consciousness symbol -->
  <ellipse cx="64" cy="64" rx="35" ry="20" fill="none" stroke="url(#accent)" stroke-width="3"/>

  <!-- Iris -->
  <circle cx="64" cy="64" r="12" fill="url(#accent)"/>

  <!-- Pupil -->
  <circle cx="64" cy="64" r="5" fill="#0D0D0D"/>

  <!-- Light reflection -->
  <circle cx="68" cy="60" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Neural network nodes around the eye -->
  <g fill="url(#accent)" opacity="0.8">
    <!-- Top nodes -->
    <circle cx="64" cy="28" r="4"/>
    <circle cx="45" cy="35" r="3"/>
    <circle cx="83" cy="35" r="3"/>

    <!-- Bottom nodes -->
    <circle cx="64" cy="100" r="4"/>
    <circle cx="45" cy="93" r="3"/>
    <circle cx="83" cy="93" r="3"/>

    <!-- Side nodes -->
    <circle cx="24" cy="64" r="3"/>
    <circle cx="104" cy="64" r="3"/>
  </g>

  <!-- Neural connections -->
  <g stroke="url(#accent)" stroke-width="1" opacity="0.5" fill="none">
    <line x1="64" y1="28" x2="64" y2="44"/>
    <line x1="45" y1="35" x2="36" y2="52"/>
    <line x1="83" y1="35" x2="92" y2="52"/>
    <line x1="64" y1="100" x2="64" y2="84"/>
    <line x1="45" y1="93" x2="36" y2="76"/>
    <line x1="83" y1="93" x2="92" y2="76"/>
    <line x1="24" y1="64" x2="29" y2="64"/>
    <line x1="104" y1="64" x2="99" y2="64"/>
  </g>
</svg>
