<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B5CFF"/>
      <stop offset="100%" style="stop-color:#9D85FF"/>
    </linearGradient>
  </defs>

  <!-- Terminal window background -->
  <rect x="10" y="20" width="108" height="88" rx="8" ry="8" fill="#1A1A1A"/>

  <!-- Title bar -->
  <rect x="10" y="20" width="108" height="20" rx="8" ry="8" fill="#262626"/>
  <rect x="10" y="32" width="108" height="8" fill="#262626"/>

  <!-- Window controls -->
  <circle cx="24" cy="30" r="5" fill="#F87171"/>
  <circle cx="40" cy="30" r="5" fill="#FBBF24"/>
  <circle cx="56" cy="30" r="5" fill="#4ADE80"/>

  <!-- Hive eye in title bar -->
  <ellipse cx="100" cy="30" rx="10" ry="6" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
  <circle cx="100" cy="30" r="3" fill="url(#accent)"/>

  <!-- Terminal prompt -->
  <text x="20" y="60" font-family="monospace" font-size="12" fill="#4ADE80">$</text>
  <text x="35" y="60" font-family="monospace" font-size="12" fill="#FFFFFF">hive-term</text>

  <!-- Cursor -->
  <rect x="95" y="50" width="8" height="14" fill="url(#accent)" opacity="0.8"/>

  <!-- Previous command -->
  <text x="20" y="80" font-family="monospace" font-size="10" fill="#A0A0A0">The Swarm is watching</text>

  <!-- Bottom prompt -->
  <text x="20" y="98" font-family="monospace" font-size="12" fill="#4ADE80">$</text>
  <rect x="35" y="88" width="2" height="12" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
