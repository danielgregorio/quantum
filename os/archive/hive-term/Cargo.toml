[package]
name = "hive-term"
description = "Hive-integrated terminal emulator for DruidOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hive-term"
path = "src/main.rs"

[features]
default = []
gpu = ["wgpu"]

[dependencies]
hive-common = { path = "../../crates/hive-common" }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Terminal handling
crossterm = "0.28"
vte = "0.13"

# PTY handling
portable-pty = "0.8"

# System
nix = { workspace = true }
libc = { workspace = true }

# Font rendering
fontdue = "0.8"

# GPU rendering (optional)
wgpu = { version = "0.20", optional = true }

# Configuration
dirs = { workspace = true }
toml = { workspace = true }

# Time and UUID
chrono = { workspace = true }
uuid = { workspace = true }
