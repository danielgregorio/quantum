# ============================================================================
# DruidOS Hyprland Configuration
# The Swarm is watching. The Swarm is learning.
# ============================================================================

# ============================================================================
# MONITORS
# ============================================================================

# Default monitor configuration (VirtIO display)
monitor=,preferred,auto,1

# For high DPI displays in VMs
# monitor=,preferred,auto,1.5

# ============================================================================
# AUTOSTART
# ============================================================================

# Hive Stack (system services started by systemd, not here)
# These are user-session components

# Desktop components
exec-once = hive-shell          # Hive overlay/notifications
exec-once = hive-dock           # Dock bar
exec-once = waybar              # Status bar (optional, can use hive-dock instead)

# Polkit agent for authentication prompts
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Clipboard manager
exec-once = wl-paste --watch cliphist store

# Wallpaper
exec-once = swaybg -i /usr/share/backgrounds/druidos/default.png -m fill

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita

# Wayland-native apps
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt theming
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# ============================================================================
# INPUT
# ============================================================================

input {
    kb_layout = us
    kb_options = ctrl:nocaps    # Caps Lock as Ctrl

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    sensitivity = 0
}

# ============================================================================
# GENERAL
# ============================================================================

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # DruidOS accent colors
    col.active_border = rgba(7B5CFFee) rgba(9D85FFee) 45deg
    col.inactive_border = rgba(333333aa)

    layout = dwindle

    allow_tearing = false
}

# ============================================================================
# DECORATION
# ============================================================================

decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
    }

    # Shadows
    drop_shadow = true
    shadow_range = 20
    shadow_offset = 0 4
    shadow_render_power = 3
    col.shadow = rgba(00000050)

    # Dim inactive windows slightly
    dim_inactive = true
    dim_strength = 0.1

    # Active opacity
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0
}

# ============================================================================
# ANIMATIONS
# ============================================================================

animations {
    enabled = true

    # Smooth bezier curves
    bezier = smooth, 0.25, 0.1, 0.25, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    # Window animations
    animation = windows, 1, 4, smooth, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, smooth

    # Fade animations
    animation = fade, 1, 4, smooth
    animation = fadeOut, 1, 4, smoothOut

    # Border animations
    animation = border, 1, 5, default
    animation = borderangle, 1, 30, smooth, loop

    # Workspaces
    animation = workspaces, 1, 5, overshot, slidevert
}

# ============================================================================
# LAYOUTS
# ============================================================================

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2         # Always split to the right/bottom
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.55
}

# ============================================================================
# GESTURES
# ============================================================================

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_create_new = true
}

# ============================================================================
# WINDOW RULES
# ============================================================================

# Hive components
windowrulev2 = float,class:^(hive-shell)$
windowrulev2 = pin,class:^(hive-shell)$
windowrulev2 = nofocus,class:^(hive-shell)$
windowrulev2 = noshadow,class:^(hive-shell)$

# Floating windows
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(gnome-calculator)$
windowrulev2 = float,class:^(file-roller)$
windowrulev2 = float,title:^(Open File)$
windowrulev2 = float,title:^(Save File)$
windowrulev2 = float,title:^(Confirm)$

# Picture-in-picture
windowrulev2 = float,title:^(Picture-in-Picture)$
windowrulev2 = pin,title:^(Picture-in-Picture)$
windowrulev2 = size 480 270,title:^(Picture-in-Picture)$
windowrulev2 = move 100%-490 100%-280,title:^(Picture-in-Picture)$

# Opacity rules
windowrulev2 = opacity 0.95,class:^(hive-term)$
windowrulev2 = opacity 0.95,class:^(Alacritty)$
windowrulev2 = opacity 0.95,class:^(kitty)$

# ============================================================================
# KEY BINDINGS
# ============================================================================

$mainMod = SUPER

# Essential
bind = $mainMod, Return, exec, hive-term      # Terminal
bind = $mainMod, Q, killactive                 # Close window
bind = $mainMod SHIFT, E, exit                 # Exit Hyprland
bind = $mainMod, Space, togglefloating         # Toggle float
bind = $mainMod, F, fullscreen                 # Fullscreen
bind = $mainMod, P, pseudo                     # Pseudo-tile

# Application launchers
bind = $mainMod, D, exec, wofi --show drun     # App launcher
bind = $mainMod, R, exec, wofi --show run      # Run command
bind = $mainMod, E, exec, nautilus             # File manager
bind = $mainMod, B, exec, firefox              # Browser

# Hive interactions
bind = $mainMod, H, exec, hive-shell toggle    # Toggle Hive overlay
bind = $mainMod SHIFT, H, exec, hive-shell quiet  # Enter quiet mode
bind = $mainMod CTRL, H, exec, hive-shell detach  # Detach current terminal

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# Clipboard
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Window focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Arrow key alternatives
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

# Window movement
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Window resizing
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace navigation
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:scratchpad

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow       # Move with Super+LMB
bindm = $mainMod, mouse:273, resizewindow     # Resize with Super+RMB

# Media keys
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness (if applicable in VM)
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ============================================================================
# MISC
# ============================================================================

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # VRR (variable refresh rate) - usually not applicable in VMs
    vrr = 0

    # Mouse
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true

    # Focus
    focus_on_activate = true
    new_window_takes_over_fullscreen = 2

    # Performance
    vfr = true
    enable_swallow = true
    swallow_regex = ^(hive-term|Alacritty|kitty)$
}

