[package]
name = "hive-synapse"
description = "SLM inference daemon for DruidOS Hive Stack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hive-synapse"
path = "src/main.rs"

[dependencies]
hive-common = { path = "../hive-common" }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# LLM inference (candle - pure Rust)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.3", optional = true }

# Alternative: llama.cpp bindings
llama-cpp-2 = { version = "0.1", optional = true }

# Dev/test-only backend: real inference via a remote Ollama server (see
# inference.rs docs) instead of the mock. Never enabled by default;
# production's hive-synapse.service also blocks the network at the OS
# level (PrivateNetwork=yes) even if a build enables this.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

# System
nix = { workspace = true }

# Time
chrono = { workspace = true }

[features]
default = ["candle"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
llama-cpp = ["dep:llama-cpp-2"]
ollama = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
