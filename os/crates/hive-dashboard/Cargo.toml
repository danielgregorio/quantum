[package]
name = "hive-dashboard"
description = "Interactive TUI panel for Hive notifications and suggestions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hive-dashboard"
path = "src/main.rs"

[dependencies]
hive-common = { path = "../hive-common" }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# TUI — event-stream lets crossterm events be awaited alongside the IPC
# socket in the same tokio::select!, instead of a blocking read loop.
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = "0.3"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
