<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Quantum">
  <title>Quantum</title>
  <!--
    The mark with the name. The same grid as logo.svg: the mark takes x 0-58,
    the name starts at x=76, with the same breathing room that separates the Q
    from the chevron.

    The name uses the system font stack because an SVG that depends on a
    downloaded font becomes something else on any machine that lacks it — and
    a logo that changes shape is not a logo.
  -->
  <g fill="none" stroke="currentColor" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="30" r="15"/>
    <path d="M31 37 L40 46"/>
    <path d="M46 20 L58 32 L46 44"/>
  </g>
  <text x="76" y="41"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.5"
        fill="currentColor">Quantum</text>
</svg>
