<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Quantum">
  <title>Quantum</title>
  <!--
    A marca com o nome. Mesma grade do logo.svg: a marca ocupa x 0-58, o nome
    comeca em x=76, com o mesmo respiro que separa o Q do chevron.

    O nome usa a pilha de fontes do sistema porque um SVG que depende de uma
    fonte baixada vira outra coisa em qualquer maquina que nao a tenha — e um
    logotipo que muda de forma nao e um logotipo.
  -->
  <g fill="none" stroke="currentColor" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="30" r="15"/>
    <path d="M31 37 L40 46"/>
    <path d="M46 20 L58 32 L46 44"/>
  </g>
  <text x="76" y="41"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.5"
        fill="currentColor">Quantum</text>
</svg>
