[package]
name = "quantum-world"
version = "0.1.0"
edition = "2021"
description = "The world's engine of Quantum's game server (PLAN_WORLD_ENGINE.md): what each player sees, and the network"
license = "MIT"
publish = false

# its own workspace: not os/'s
[workspace]

[lib]
name = "quantum_world"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# the module for Python (maturin builds it); `cargo test --no-default-features` tests the engine without a Python
python = ["dep:pyo3"]

[dependencies]
crossbeam-channel = "0.5.17"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
indexmap = "2.14.2"
pyo3 = { version = "0.30", features = ["abi3-py312"], optional = true }
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.30.0"

[profile.release]
lto = "thin"
codegen-units = 1
