name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run docs:build

      # ignoreDeadLinks is on in the VitePress config, so the build never
      # reports a link to a page that does not exist. This crawls the built
      # site and fails the deploy on any.
      - name: No link to a page that does not exist
        run: |
          npx vitepress preview docs --port 4173 &
          python3 scripts/check-docs-links.py http://localhost:4173/quantum/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
