name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # O framework + extras que a suite declarada exercita.
          pip install -e ".[dev,db,jobs,websocket]"
          # O admin (quantum_admin) tem deps proprias (fastapi, sqlalchemy,
          # PyJWT, cryptography); sem elas os testes de admin falham no
          # collect em vez de rodar.
          pip install -r quantum_admin/backend/requirements.txt

      - name: Lint with ruff (advisory)
        # Informativo por enquanto: mede o codigo como esta sem barrar o
        # build. O caminho estava apontando para src/, que nao tem arquivos
        # rastreados desde 7516ad8 — por isso o lint nunca via nada.
        run: ruff check quantum tests || true

      - name: Run tests with coverage
        # SEM caminho fixo: pytest.ini declara testpaths = tests examples
        # quantum-as4, entao isto roda a suite inteira que o desenvolvedor
        # roda. Antes era `pytest tests/ --cov=src`: --cov=src media um
        # diretorio inexistente e a suite declarada nunca rodava no CI.
        run: pytest --cov=quantum --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  build-examples:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quantum
        run: pip install -e .

      - name: Build examples
        # Via o entry point instalado (`quantum`), nao `python src/cli/runner.py`
        # — o CLI mudou para o pacote instalado e o caminho src/ nao existe mais.
        run: |
          quantum run examples/hello.q --target html
          quantum run examples/counter.q --target html
