name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The framework + the extras the declared suite exercises.
          # rag: the knowledge base (chromadb) is tested against a stand-in
          # model server (tests/fake_ollama.py) — without it those tests skip.
          pip install -e ".[dev,db,jobs,websocket,rag]"
          # The admin (quantum_admin) has its own deps (fastapi, sqlalchemy,
          # PyJWT, cryptography); without them the admin tests fail at
          # collection instead of running.
          pip install -r quantum_admin/backend/requirements.txt
          # A headless browser for the apps' layout and click tests
          # (tests/apps/*_browser.py). Without it those tests are skipped.
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Lint with ruff
        # Blocking: the code is clean, and pyproject.toml says why each rule
        # left out is left out. A finding is fixed, not waved through.
        run: ruff check quantum tests

      - name: Run tests with coverage
        # NO fixed path: pytest.ini declares testpaths = tests examples
        # quantum-as4, so this runs the whole suite the developer runs. It was
        # `pytest tests/ --cov=src`: --cov=src measured a directory that does
        # not exist and the declared suite never ran in CI.
        # In parallel (-n auto): the suite depends on no order and no shared
        # state (the root conftest restores logging per test). A test that
        # really has to run alone — a fixed port, a file outside tmp — carries
        # @pytest.mark.isolated and runs afterwards, serially.
        # The Laboratory (games, Godot, React Native) runs in the job below.
        run: |
          pytest -n auto -m "not isolated and not laboratory" --cov=quantum --cov-report=xml
          pytest -m "isolated and not laboratory" --cov=quantum --cov-append --cov-report=xml || [ $? -eq 5 ]

      - name: AI services coverage (A1, at least 80%)
        run: |
          coverage report --fail-under=80 --include="*/runtime/llm_service.py,*/runtime/knowledge_service.py,*/runtime/llm_providers.py,*/runtime/llm_stream.py"

  laboratory:
    # SUPPORT_TIERS.md: games, the Godot codegen and the React Native target
    # stay in the repository and in the suite (decision D1), in a job of their
    # own — required like the other — so a red CI says at once whether the
    # Core or the Laboratory broke. The root conftest marks those tests by file.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # The same as the test job (without the browser): pytest collects the
        # whole suite before filtering by marker, and the admin conftest
        # imports its dependencies at collection.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,jobs,websocket]"
          pip install -r quantum_admin/backend/requirements.txt

      - name: Run Laboratory tests
        run: pytest -n auto -m laboratory

  docs:
    # The docs site, on every push and pull request. "Deploy Docs" builds it
    # too, but only after a change to docs/ has reached main -- a broken link
    # was found once it was already published. ignoreDeadLinks is false in
    # docs/.vitepress/config.js, so the build fails on a link to a missing
    # page; the crawler also checks links written as HTML and links that
    # escape the site's base path.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build the docs
        run: npm run docs:build
      - name: Search splits Chinese words (and still finds ui:pager's "pager")
        run: node docs/.vitepress/search-tokenize.check.mjs

      - name: The playground runs every example in Pyodide, with this quantum/
        run: node scripts/check-playground.mjs

      - name: No link to a page that does not exist
        run: |
          npx vitepress preview docs --port 4173 &
          python3 scripts/check-docs-links.py http://localhost:4173/

      - name: Translations behind their English source (a report, not a failure)
        # A stale page already shows "this translation may be out of date"; this
        # lists them, in the log and in the run summary.
        run: python3 scripts/translation-status.py | tee -a "$GITHUB_STEP_SUMMARY"

  build-examples:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install quantum
        run: pip install -e .

      - name: Build examples
        # Through the installed entry point (`quantum`), not `python src/cli/runner.py`
        # — the CLI moved into the installed package and the src/ path no longer exists.
        run: |
          quantum run examples/hello.q --target html
          quantum run examples/counter.q --target html
