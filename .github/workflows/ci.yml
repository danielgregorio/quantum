name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The framework + the extras the declared suite exercises.
          # rag: the knowledge base (chromadb) is tested against a stand-in
          # model server (tests/fake_ollama.py) — without it those tests skip.
          pip install -e ".[dev,db,jobs,websocket,rag]"
          # The admin (quantum_admin) has its own deps (fastapi, sqlalchemy,
          # PyJWT, cryptography); without them the admin tests fail at
          # collection instead of running.
          pip install -r quantum_admin/backend/requirements.txt
          # A headless browser for the apps' layout and click tests
          # (tests/apps/*_browser.py). Without it those tests are skipped.
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Lint with ruff
        # Blocking: the code is clean, and pyproject.toml says why each rule
        # left out is left out. A finding is fixed, not waved through.
        run: ruff check quantum tests

      - name: Run tests with coverage
        # NO fixed path: pytest.ini declares testpaths = tests examples
        # quantum-as4, so this runs the whole suite the developer runs. It was
        # `pytest tests/ --cov=src`: --cov=src measured a directory that does
        # not exist and the declared suite never ran in CI.
        # In parallel (-n auto): the suite depends on no order and no shared
        # state (the root conftest restores logging per test). A test that
        # really has to run alone — a fixed port, a file outside tmp — carries
        # @pytest.mark.isolated and runs afterwards, serially.
        # The Laboratory (games, Godot, React Native) runs in the job below.
        run: |
          pytest -n auto -m "not isolated and not laboratory" --cov=quantum --cov-report=xml
          pytest -m "isolated and not laboratory" --cov=quantum --cov-append --cov-report=xml || [ $? -eq 5 ]

      - name: AI services coverage (A1, at least 80%)
        run: |
          coverage report --fail-under=80 --include="*/runtime/llm_service.py,*/runtime/knowledge_service.py,*/runtime/llm_providers.py,*/runtime/llm_stream.py"

  laboratory:
    # SUPPORT_TIERS.md: games, the Godot codegen and the React Native target
    # stay in the repository and in the suite (decision D1), in a job of their
    # own — required like the other — so a red CI says at once whether the
    # Core or the Laboratory broke. The root conftest marks those tests by file.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # The same as the test job (without the browser): pytest collects the
        # whole suite before filtering by marker, and the admin conftest
        # imports its dependencies at collection. [play]: the MCP server of
        # the play protocol, which tests/godot/test_godot_play_mcp.py drives.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,jobs,websocket,play]"
          pip install -r quantum_admin/backend/requirements.txt

      - name: Godot (pinned in quantum/runtime/godot_bin.py)
        # The games are checked and replayed headless by the real engine
        # (tests/godot/). Cached by version; a miss downloads the release.
        id: godot-version
        run: echo "version=$(python scripts/godot.py version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/quantum/godot
          key: godot-${{ runner.os }}-${{ steps.godot-version.outputs.version }}
      - name: Install Godot
        run: python scripts/godot.py install

      - name: Run Laboratory tests
        # QUANTUM_GODOT_REQUIRED: without Godot the tests in tests/godot/ skip
        # on a developer's machine; here a missing binary is a failure.
        env:
          QUANTUM_GODOT_REQUIRED: '1'
        run: pytest -n auto -m laboratory

  games-in-browser:
    # The web builds of the games, played in Chromium as a visitor of /games/
    # would (scripts/check-games-in-browser.py). The replay tests above run each
    # game in Godot with its files on disk; an export carries only Godot's
    # imports, and its keys arrive as browser events. Both broke on the site
    # once while the Laboratory was green. Each game must start on its scene,
    # print no error, and react to its keys (projects/games.json: "check").
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install quantum and a headless browser
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[websocket]" playwright
          python -m playwright install --with-deps chromium

      # The binary and the export templates (1.2 GB), with the same cache as
      # Deploy Docs, which exports the same games for the site.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/quantum
            ~/.local/share/godot/export_templates
          key: godot-export-${{ hashFiles('quantum/runtime/godot_bin.py') }}
      - run: python scripts/godot.py install
      - run: python scripts/export-games.py --install-templates

      - name: Export every game for the browser
        run: python scripts/export-games.py --preset Web --out "$RUNNER_TEMP/games"

      - name: Play them in Chromium
        run: python scripts/check-games-in-browser.py "$RUNNER_TEMP/games"

      # The play protocol, phase 6: an agent hosts Pong, live, and the web
      # build joins it from Chromium as the person at the other end.
      - name: An agent plays Pong against the browser
        run: python scripts/check-agent-in-browser.py "$RUNNER_TEMP/games"

      # Two people in their browsers: two Chromium pages meet at quantum
      # relay and play Pong, as players 1 and 2, without a desync.
      - name: Two browsers play Pong through a relay
        run: python scripts/check-relay-in-browser.py "$RUNNER_TEMP/games"

      # The play protocol's browser bridge: an agent wins the RPG's web
      # build, in real time, through window.quantumPlay.
      - name: An agent wins the RPG in the browser
        run: python scripts/check-play-in-browser.py "$RUNNER_TEMP/games"

      # A saved game survives the page: Keep's web build saves on entering
      # room 2, the page reloads, and Continue brings it back there.
      - name: A saved game survives a reload
        run: python scripts/check-save-in-browser.py "$RUNNER_TEMP/games"

      - name: What each game showed (check.png, and Pong against the agent)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: games-in-browser
          path: |
            ${{ runner.temp }}/games/*/check.png
            ${{ runner.temp }}/games/pong/agent.png
            ${{ runner.temp }}/games/keep/save.png
            ${{ runner.temp }}/games/pong/relay-*.png
            ${{ runner.temp }}/games/rpg/bridge.png
          if-no-files-found: ignore

  relay-image:
    # The relay as it is deployed (deploy/relay/Dockerfile): the image builds,
    # compiles the networked games, and answers its health check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the relay's image
        run: docker build -f deploy/relay/Dockerfile -t quantum-relay .
      - name: It starts and says what it holds
        run: |
          docker run -d --name relay -p 8080:8080 quantum-relay
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/health | grep '"pong"'
          docker logs relay

  beta-reports-image:
    # The beta's reports as the homelab runs them (projects/beta-reports/Dockerfile): the image
    # builds, migrates its database and keeps a report posted to it. No token here, so the forge
    # is not told: the report is kept all the same (onerror="continue", INV-3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the receiver's image
        run: docker build -f projects/beta-reports/Dockerfile -t quantum-beta-reports .
      - name: It keeps a report
        run: |
          docker run -d --name reports -p 8095:8095 quantum-beta-reports
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8095/api/reports && break; sleep 1; done
          answer=$(curl -s -X POST http://127.0.0.1:8095/api/reports -H 'Content-Type: application/json' \
            -d '{"game": "pandafoot", "version": "2.1", "kind": "other", "text": "From CI"}')
          echo "$answer"
          echo "$answer" | grep '"number": 1'
          docker logs reports

  docs:
    # The docs site, on every push and pull request. "Deploy Docs" builds it
    # too, but only after a change to docs/ has reached main -- a broken link
    # was found once it was already published. ignoreDeadLinks is false in
    # docs/.vitepress/config.js, so the build fails on a link to a missing
    # page; the crawler also checks links written as HTML and links that
    # escape the site's base path.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build the docs
        run: npm run docs:build
      - name: Search splits Chinese words (and still finds ui:pager's "pager")
        run: node docs/.vitepress/search-tokenize.check.mjs

      - name: The playground runs every example in Pyodide, with this quantum/
        run: node scripts/check-playground.mjs

      - name: No link to a page that does not exist
        run: |
          npx vitepress preview docs --port 4173 &
          python3 scripts/check-docs-links.py http://localhost:4173/

      - name: Translations behind their English source (a report, not a failure)
        # A stale page already shows "this translation may be out of date"; this
        # lists them, in the log and in the run summary.
        run: python3 scripts/translation-status.py | tee -a "$GITHUB_STEP_SUMMARY"

  build-examples:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install quantum
        run: pip install -e .

      - name: Build examples
        # Through the installed entry point (`quantum`), not `python src/cli/runner.py`
        # — the CLI moved into the installed package and the src/ path no longer exists.
        run: |
          quantum run examples/hello.q --target html
          quantum run examples/counter.q --target html
