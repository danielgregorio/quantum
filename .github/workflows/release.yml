name: Release

# Dispara ao empurrar uma tag v* (ex.: git tag v1.0.0 && git push --tags).
# Ordem: test -> build -> publish (PyPI) -> github-release.
# NADA e publicado se os testes nao passarem: `build` depende de `test`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Porta de entrada: a MESMA suite que o desenvolvedor roda (pytest.ini:
  # testpaths = tests examples quantum-as4). Se cair, nada e publicado.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,jobs,websocket]"
          # deps do admin (quantum_admin), senao os testes de admin caem no collect
          pip install -r quantum_admin/backend/requirements.txt
      - name: Run the full declared test suite
        run: pytest --cov=quantum --cov-report=xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag must match the version in pyproject.toml
        # Impede publicar v2.0.0 enquanto o pyproject diz 1.0.0.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$PROJ"
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::A tag ($TAG) nao bate com project.version do pyproject.toml ($PROJ). Alinhe os dois antes de publicar."
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Sanity-check the built artifacts
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # OIDC trusted publishing: o PyPI confia neste workflow por identidade,
    # sem token guardado em secrets. Requer configurar o publisher confiavel
    # no PyPI uma vez (ver README/docs do projeto).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with the built artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
