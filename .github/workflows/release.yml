name: Release

# Runs on pushing a v* tag (e.g. git tag v0.9.0 && git push --tags).
# Order: ci (the whole of ci.yml) -> build -> publish (PyPI) -> github-release.
# NOTHING is published unless CI passes: `build` depends on `ci`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The gate is CI itself (ci.yml), every job of it, on the tagged commit: the
  # suite with Godot and the browser, the Laboratory, the games in the browser,
  # the packages on Linux, Windows and macOS, the images, the site. It was a
  # pytest of its own that drifted from CI (no Godot, no browser, the
  # Laboratory without its extras), so a tag could fail what CI passed, or
  # pass what CI failed. If any job fails, nothing is published.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tag must match the version in pyproject.toml
        # Prevents publishing v1.0.0 while the pyproject says 0.9.0.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$PROJ"
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::The tag ($TAG) does not match project.version in pyproject.toml ($PROJ). Align the two before publishing."
            exit 1
          fi
      - name: CHANGELOG.md must describe this version
        run: python scripts/release-notes.py "$GITHUB_REF_NAME" > /dev/null
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Sanity-check the built artifacts
        run: |
          python -m pip install twine
          twine check dist/*
      - name: The wheel installs alone and runs, with the files it reads
        # CI runs a checkout; this is what `pip install quantum-framework` gets.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/quantum --version | grep -F "${GITHUB_REF_NAME#v}"
          /tmp/clean/bin/python -c "from quantum.runtime.ui_tui import TUI_DIR; assert (TUI_DIR / 'icon.png').is_file() and (TUI_DIR / 'tui.gd').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # OIDC trusted publishing: PyPI trusts this workflow by identity, with no
    # token stored in secrets. It requires configuring the trusted publisher
    # on PyPI once (see the project's README/docs).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Release notes from CHANGELOG.md
        run: python scripts/release-notes.py "$GITHUB_REF_NAME" > release_notes.md
      - name: Create GitHub release with the built artifacts
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*
