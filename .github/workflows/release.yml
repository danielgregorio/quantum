name: Release

# Runs on pushing a v* tag (e.g. git tag v0.9.0 && git push --tags).
# Order: test -> build -> publish (PyPI) -> github-release.
# NOTHING is published unless the tests pass: `build` depends on `test`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The gate: the SAME suite the developer runs (pytest.ini:
  # testpaths = tests examples quantum-as4). If it fails, nothing is published.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,jobs,websocket]"
          # deps do admin (quantum_admin), senao os testes de admin caem no collect
          pip install -r quantum_admin/backend/requirements.txt
      - name: Run the full declared test suite
        run: pytest --cov=quantum --cov-report=xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tag must match the version in pyproject.toml
        # Prevents publishing v1.0.0 while the pyproject says 0.9.0.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$PROJ"
          if [ "$TAG" != "$PROJ" ]; then
            echo "::error::The tag ($TAG) does not match project.version in pyproject.toml ($PROJ). Align the two before publishing."
            exit 1
          fi
      - name: CHANGELOG.md must describe this version
        run: python scripts/release-notes.py "$GITHUB_REF_NAME" > /dev/null
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Sanity-check the built artifacts
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # OIDC trusted publishing: PyPI trusts this workflow by identity, with no
    # token stored in secrets. It requires configuring the trusted publisher
    # on PyPI once (see the project's README/docs).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Release notes from CHANGELOG.md
        run: python scripts/release-notes.py "$GITHUB_REF_NAME" > release_notes.md
      - name: Create GitHub release with the built artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
