name: Playtest

# The play protocol, phase 7 (PLAN_PLAY_PROTOCOL.md): a Claude agent tries to
# finish each game toward its goal in projects/games.json, and the job
# reports reached, not reached or stuck, with each session's tape. A reached
# goal's tape, copied into tests/godot/playtests/, is a test from then on.
#
# It spends API credit, so it runs only when someone starts it. It needs the
# ANTHROPIC_API_KEY secret; without it the job says so and stops. To run it
# on a schedule, uncomment `schedule`.

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Games to play (space-separated; empty: every game with a goal)'
        required: false
        default: ''
      model:
        description: 'The Claude model that plays'
        required: false
        default: 'claude-opus-5-5'
  # schedule:
  #   - cron: '0 6 * * 1'   # Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Is there a key?
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret: the playtest needs one to play. Nothing was run." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@v7
        if: steps.key.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install quantum with the play extra, and Godot
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[play]"
          python scripts/godot.py install

      - name: Play
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GAMES: ${{ inputs.games }}
          MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
        run: |
          quantum playtest $GAMES --model "$MODEL" --out "$RUNNER_TEMP/playtest"
          cat "$RUNNER_TEMP/playtest/playtest.md" >> "$GITHUB_STEP_SUMMARY"

      - name: The report and the tapes
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playtest
          path: ${{ runner.temp }}/playtest/
          if-no-files-found: ignore
