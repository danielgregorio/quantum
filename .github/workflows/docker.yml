name: Docker

on:
  # Manual apenas. Este workflow depende de secrets/self-hosted runner
  # da infra pessoal do autor, que nao existem neste repositorio; ao
  # disparar automatico ele falha em todo push e pinta o repo de
  # vermelho. Rode pela aba Actions quando os secrets estiverem
  # configurados.
  workflow_dispatch:

env:
  IMAGE_NAME: danielgregorio/quantum

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
