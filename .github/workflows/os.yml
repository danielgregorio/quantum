name: Quantum OS

# os/ is a Rust workspace of its own (the Hive, grove, the installer). It is
# checked only when a change touches it.
on:
  push:
    branches: [main]
    paths: ['os/**', '.github/workflows/os.yml', 'quantum/runtime/ui_pixel.py', 'tests/apps/test_ui_parity_script.py']
  pull_request:
    paths: ['os/**', '.github/workflows/os.yml', 'quantum/runtime/ui_pixel.py', 'tests/apps/test_ui_parity_script.py']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: os

jobs:
  check:
    name: fmt, clippy, test, Hive lab, VM lab
    # 24.04: the VM lab's guest is Ubuntu 24.04, and the host downloads its
    # packages for it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            os/target/
          key: ${{ runner.os }}-os-cargo-${{ hashFiles('os/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-os-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # A Quantum page on the Hive's screen: the UI parity test's one script
      # on hive-screen (this build, no display), with `quantum pixel` as the
      # page's runtime (docs/guide/ui.md). The Python workflow skips it
      # without the binary; here it runs.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: The parity test on the screen
        working-directory: .
        run: |
          pip install -e ".[dev]"
          HIVE_SCREEN=os/target/debug/hive-screen pytest tests/apps/test_ui_parity_script.py -k pixel -p no:cacheprovider

      # The real hive-cortex and hive-synapse, the rest played by hive-lab,
      # as root in a private mount namespace (crates/hive-lab/README.md).
      - name: Play the Hive lab's tapes
        run: scripts/lab/hive-tapes.sh

      # The MCP server's wrapper, end to end (no MCP client needed)
      - name: Hive lab MCP selftest
        run: python3 scripts/lab/hive_mcp.py --selftest

      # The real system: Ubuntu's cloud image in QEMU, the Hive installed from
      # this build, restored from a snapshot for each tape
      # (scripts/lab/vm/README.md). The runner's KVM makes the first boot quick.
      - name: VM lab setup (QEMU, KVM)
        run: |
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play the VM lab's tapes
        run: python3 scripts/lab/vm/vm.py --play

      - name: VM lab evidence
        if: failure()
        run: tail -n 150 ~/.cache/quantum-os-lab/run/serial.log || true
