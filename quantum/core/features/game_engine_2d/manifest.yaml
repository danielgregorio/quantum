feature:
  name: "game_engine_2d"
  display_name: "Game Engine 2D (qg: namespace)"
  version: "1.0.0"
  status: "experimental"
  migration_type: "option_c"

description: |
  2D game engine for Quantum Framework.
  Compiles declarative XML (qg: namespace) to a Godot 4 project
  (.tscn scenes, .gd scripts), which Godot runs and exports.

tags:
  - "game"
  - "2d"
  - "godot"
  - "physics"
  - "sprites"

maintainers:
  - "Daniel"
  - "Claude"

api:
  ast_nodes: "quantum/core/features/game_engine_2d/src/ast_nodes.py"
  parser: "quantum/core/features/game_engine_2d/src/parser.py"
  code_generator: "quantum/runtime/godot_code_generator.py"
  builder: "quantum/runtime/game_builder.py"

testing:
  integration_tests: 3
  coverage: 80
